version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: revolve-ai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: revolve
      POSTGRES_PASSWORD: revolve_dev_password
      POSTGRES_DB: revolve_ai
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U revolve -d revolve_ai']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
