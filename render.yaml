services:
  # ─── Next.js Application Web Service ─────────────────────────
  - type: web
    name: revolve-ai
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: revolve-ai-postgres
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_RAZORPAY_KEY_ID
        sync: false
      - key: AI_PROVIDER
        value: grok
      - key: GROK_API_KEY
        sync: false
      - key: GROK_MODEL
        value: grok-2-latest

databases:
  # ─── Render Managed PostgreSQL Database ───────────────────────
  - name: revolve-ai-postgres
    databaseName: revolve_ai
    user: revolve
    region: singapore
    plan: starter
    postgresMajorVersion: 16
